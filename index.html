<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pong</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: black;
  overflow: hidden;
  font-family: Arial, sans-serif;
}
canvas { display: block; }

#overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  color: #0f0;
  gap: 16px;
  z-index: 10;
}

button, select {
  font-size: 20px;
  padding: 10px 22px;
  border-radius: 10px;
  border: none;
}

button {
  background: #0f0;
  color: #000;
}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="overlay">
  <h1 id="msg">Zorluk Seç</h1>
  <select id="difficulty">
    <option value="easy">Kolay</option>
    <option value="medium" selected>Orta</option>
    <option value="hard">Zor</option>
  </select>
  <button onclick="startGame()">Başla</button>
</div>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

window.addEventListener("resize", () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

const overlay = document.getElementById("overlay");
const msg = document.getElementById("msg");
const diffSelect = document.getElementById("difficulty");

const paddleH = 100;
const paddleW = 12;
const ballR = 8;

let playerY = canvas.height/2 - paddleH/2;
let aiY = canvas.height/2 - paddleH/2;

let ballX, ballY, ballVX, ballVY;
let lives = 3;
let running = false;

let aiSpeed = 0.05;
let aiError = 0.9;

/* ===== KONTROLLER ===== */

// MOBİL
canvas.addEventListener("touchmove", e => {
  e.preventDefault();
  playerY = e.touches[0].clientY - paddleH / 2;
}, { passive:false });

// PC - MOUSE
canvas.addEventListener("mousemove", e => {
  const rect = canvas.getBoundingClientRect();
  playerY = e.clientY - rect.top - paddleH / 2;
});

/* ===== OYUN ===== */

function startGame() {
  const d = diffSelect.value;
  if (d === "easy")   { aiSpeed = 0.035; aiError = 0.80; }
  if (d === "medium") { aiSpeed = 0.05;  aiError = 0.90; }
  if (d === "hard")   { aiSpeed = 0.075; aiError = 0.97; }

  lives = 3;
  running = true;
  overlay.style.display = "none";
  resetBall(1);
}

function resetBall(dir) {
  playerY = canvas.height/2 - paddleH/2;
  aiY = canvas.height/2 - paddleH/2;
  ballX = canvas.width/2;
  ballY = canvas.height/2;
  ballVX = dir * 5;
  ballVY = Math.random()*4 - 2;
}

function update() {
  if (!running) return;

  playerY = Math.max(0, Math.min(canvas.height - paddleH, playerY));

  if (Math.random() < aiError) {
    aiY += (ballY - (aiY + paddleH/2)) * aiSpeed;
  }
  aiY = Math.max(0, Math.min(canvas.height - paddleH, aiY));

  ballX += ballVX;
  ballY += ballVY;

  if (ballY < ballR || ballY > canvas.height-ballR) ballVY *= -1;

  // Oyuncu
  if (ballX < 20+paddleW && ballY > playerY && ballY < playerY+paddleH) {
    ballVX = Math.abs(ballVX);
  }

  // AI
  if (ballX > canvas.width-20-paddleW && ballY > aiY && ballY < aiY+paddleH) {
    ballVX = -Math.abs(ballVX);
  }

  if (ballX < 0) {
    lives--;
    resetBall(1);
  }

  if (ballX > canvas.width) {
    running = false;
    msg.textContent = "Süpersin aşkım ❤️";
    overlay.style.display = "flex";
  }

  if (lives <= 0) {
    running = false;
    msg.textContent = "Yenildin 😅";
    overlay.style.display = "flex";
  }
}

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle="#0f0";
  ctx.fillRect(20,playerY,paddleW,paddleH);
  ctx.fillRect(canvas.width-20-paddleW,aiY,paddleW,paddleH);

  ctx.fillStyle="#fff";
  ctx.beginPath();
  ctx.arc(ballX,ballY,ballR,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#0f0";
  ctx.font="18px Arial";
  ctx.fillText("❤️ "+lives,20,30);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
