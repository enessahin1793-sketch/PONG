<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mobil Pong</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    height: 100%;
    overflow: hidden;
    touch-action: none;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// ekran boyutuna tam otur
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

const paddleH = 120;
const paddleW = 12;

let lives = 3;

let player = {
  x: 20,
  y: canvas.height / 2 - paddleH / 2
};

let ai = {
  x: () => canvas.width - paddleW - 20,
  y: canvas.height / 2 - paddleH / 2
};

let ball = {
  x: canvas.width / 2,
  y: canvas.height / 2,
  r: 8,
  speed: 6,
  vx: 6,
  vy: 3
};

function resetBall(dir = 1) {
  ball.x = canvas.width / 2;
  ball.y = canvas.height / 2;
  ball.speed = 6;
  ball.vx = dir * 6;
  ball.vy = Math.random() * 4 - 2;
}

// mobil + mouse kontrol
canvas.addEventListener("touchmove", e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  player.y = e.touches[0].clientY - rect.top - paddleH / 2;
}, { passive: false });

canvas.addEventListener("mousemove", e => {
  const rect = canvas.getBoundingClientRect();
  player.y = e.clientY - rect.top - paddleH / 2;
});

function collision(p) {
  return (
    ball.x - ball.r < p.x + paddleW &&
    ball.x + ball.r > p.x &&
    ball.y + ball.r > p.y &&
    ball.y - ball.r < p.y + paddleH
  );
}

function update() {
  // sınırlar
  player.y = Math.max(0, Math.min(canvas.height - paddleH, player.y));

  // AI (zor ama adil)
  let target = ball.y - paddleH / 2;
  ai.y += (target - ai.y) * 0.12;
  ai.y = Math.max(0, Math.min(canvas.height - paddleH, ai.y));

  // top hareket
  ball.x += ball.vx;
  ball.y += ball.vy;

  if (ball.y < ball.r || ball.y > canvas.height - ball.r) {
    ball.vy *= -1;
  }

  if (collision(player)) {
    let hit = (ball.y - (player.y + paddleH / 2)) / (paddleH / 2);
    ball.vx = Math.abs(ball.vx);
    ball.vy = hit * 7;
    ball.speed += 0.4;
  }

  if (collision({ x: ai.x(), y: ai.y })) {
    let hit = (ball.y - (ai.y + paddleH / 2)) / (paddleH / 2);
    ball.vx = -Math.abs(ball.vx);
    ball.vy = hit * 7;
    ball.speed += 0.4;
  }

  ball.vx = Math.sign(ball.vx) * ball.speed;

  // gol
  if (ball.x < 0) {
    lives--;
    resetBall(1);
  }

  if (ball.x > canvas.width) {
    resetBall(-1);
  }

  if (lives <= 0) {
    lives = 3;
    resetBall();
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // paddle'lar
  ctx.fillStyle = "#0f0";
  ctx.fillRect(player.x, player.y, paddleW, paddleH);
  ctx.fillRect(ai.x(), ai.y, paddleW, paddleH);

  // top
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fillStyle = "#fff";
  ctx.fill();

  // UI
  ctx.fillStyle = "#0f0";
  ctx.font = "18px Arial";
  ctx.fillText("❤️ Can: " + lives, 20, 30);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
