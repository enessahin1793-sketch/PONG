<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mobil Pong</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: black;
  overflow: hidden;
  touch-action: none;
  font-family: Arial, sans-serif;
}
canvas { display: block; }

#overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  color: #0f0;
  gap: 16px;
}

button {
  font-size: 20px;
  padding: 12px 26px;
  border: none;
  border-radius: 12px;
  background: #0f0;
  color: #000;
}

select {
  font-size: 18px;
  padding: 8px;
}

.heart {
  position: absolute;
  font-size: 30px;
  animation: float 1.5s ease-out forwards;
}
@keyframes float {
  0% { opacity:1; transform: translateY(0); }
  100% { opacity:0; transform: translateY(-80px); }
}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="overlay">
  <h1 id="msg">Zorluk Seç</h1>
  <select id="difficulty">
    <option value="easy">Kolay</option>
    <option value="medium" selected>Orta</option>
    <option value="hard">Zor</option>
  </select>
  <button onclick="startGame()">Başla</button>
</div>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const overlay = document.getElementById("overlay");
const msg = document.getElementById("msg");
const diffSelect = document.getElementById("difficulty");

const paddleH = 100;
const paddleW = 12;
const ballR = 8;

let playerY, aiY;
let ballX, ballY, ballVX, ballVY;
let lives = 3;
let running = false;

let aiSpeed = 0.05;
let aiError = 0.9;

const hitSound = new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=");
const scoreSound = new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=");

canvas.addEventListener("touchmove", e => {
  e.preventDefault();
  playerY = e.touches[0].clientY - paddleH / 2;
}, { passive:false });

function startGame() {
  const d = diffSelect.value;
  if (d === "easy") { aiSpeed = 0.035; aiError = 0.85; }
  if (d === "medium") { aiSpeed = 0.05; aiError = 0.9; }
  if (d === "hard") { aiSpeed = 0.075; aiError = 0.97; }

  lives = 3;
  running = true;
  overlay.style.display = "none";
  resetBall(1);
}

function resetBall(dir) {
  playerY = canvas.height/2 - paddleH/2;
  aiY = canvas.height/2 - paddleH/2;
  ballX = canvas.width/2;
  ballY = canvas.height/2;
  ballVX = dir * 5;
  ballVY = Math.random()*4 - 2;
}

function heartBurst() {
  for (let i=0;i<10;i++) {
    const h = document.createElement("div");
    h.className = "heart";
    h.textContent = "❤️";
    h.style.left = Math.random()*canvas.width+"px";
    h.style.top = canvas.height/2+"px";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),1500);
  }
}

function update() {
  if (!running) return;

  playerY = Math.max(0, Math.min(canvas.height - paddleH, playerY));

  if (Math.random() < aiError) {
    aiY += (ballY - (aiY + paddleH/2)) * aiSpeed;
  }
  aiY = Math.max(0, Math.min(canvas.height - paddleH, aiY));

  ballX += ballVX;
  ballY += ballVY;

  if (ballY < ballR || ballY > canvas.height-ballR) ballVY *= -1;

  if (ballX < 20+paddleW && ballY > playerY && ballY < playerY+paddleH) {
    ballVX = Math.abs(ballVX);
    hitSound.play();
    navigator.vibrate?.(30);
  }

  if (ballX > canvas.width-20-paddleW && ballY > aiY && ballY < aiY+paddleH) {
    ballVX = -Math.abs(ballVX);
    hitSound.play();
  }

  if (ballX < 0) {
    lives--;
    scoreSound.play();
    navigator.vibrate?.(100);
    resetBall(1);
  }

  if (ballX > canvas.width) {
    running = false;
    msg.textContent = "Süpersin aşkım ❤️";
    overlay.style.display = "flex";
    heartBurst();
  }

  if (lives <= 0) {
    running = false;
    msg.textContent = "Yenildin 😅";
    overlay.style.display = "flex";
  }
}

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle="#0f0";
  ctx.fillRect(20,playerY,paddleW,paddleH);
  ctx.fillRect(canvas.width-20-paddleW,aiY,paddleW,paddleH);

  ctx.fillStyle="#fff";
  ctx.beginPath();
  ctx.arc(ballX,ballY,ballR,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#0f0";
  ctx.font="18px Arial";
  ctx.fillText("❤️ "+lives,20,30);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
